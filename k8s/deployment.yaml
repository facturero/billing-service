apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: cmr/billing-service:latest
          ports:
            - containerPort: 3009
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3009"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: password
            - name: DB_NAME
              value: "billing_db"
            - name: CORS_ORIGIN
              value: "https://cmr.example.com"
