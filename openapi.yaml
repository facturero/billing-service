openapi: 3.0.3
info:
  title: billing-service
  version: 1.0.0
  description: Facturación comercial (Fase 1 — sin integración fiscal)

paths:
  /invoices:
    get:
      summary: Listar facturas
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, issued, voided]
        - name: customerId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista de facturas
    post:
      summary: Crear borrador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                documentTypeId:
                  type: string
                currencyCode:
                  type: string
                  default: USD
              required: [customerId, documentTypeId]
      responses:
        '201':
          description: Factura creada

  /invoices/{id}:
    get:
      summary: Detalle de factura
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalle
    patch:
      summary: Editar borrador
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                documentTypeId:
                  type: string
                currencyCode:
                  type: string
      responses:
        '200':
          description: Factura actualizada

  /invoices/{id}/lines:
    post:
      summary: Agregar línea
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                description:
                  type: string
                quantity:
                  type: number
                unitPrice:
                  type: string
                discountCents:
                  type: integer
              required: [productId, description, quantity, unitPrice]
      responses:
        '201':
          description: Línea agregada

  /invoices/{id}/lines/{lineId}:
    delete:
      summary: Quitar línea
      parameters:
        - name: id
          in: path
          required: true
        - name: lineId
          in: path
          required: true
      responses:
        '200':
          description: Línea removida

  /invoices/from-pos:
    post:
      summary: Ingesta de una venta del POS (crea la factura y la emite)
      description: >
        Convierte una venta de caja en una factura ya emitida: la numera con la
        secuencia del punto de emisión del terminal, descuenta stock (vía evento)
        y la manda al SRI. Es idempotente por (terminalId, posSaleId): un
        reintento devuelve 200 con la misma factura en vez de crear otra.
        Los totales se recalculan desde el catálogo; si no coinciden con los del
        terminal, la diferencia queda en posTotalsDiffCents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                terminalId:
                  type: string
                  description: Identidad estable del equipo (deviceId del POS)
                posSaleId:
                  type: string
                  description: Id de la venta en la base local del terminal
                establishmentId:
                  type: string
                emissionPointId:
                  type: string
                customerId:
                  type: string
                  nullable: true
                  description: Sin él se factura a CONSUMIDOR FINAL
                currencyCode:
                  type: string
                posTotalCents:
                  type: integer
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      productId:
                        type: string
                      description:
                        type: string
                      quantity:
                        type: number
                      unitPrice:
                        type: string
                      discountCents:
                        type: integer
                    required: [productId, quantity, unitPrice]
              required: [terminalId, posSaleId, establishmentId, emissionPointId, lines]
      responses:
        '200':
          description: La venta ya estaba ingresada; se devuelve la misma factura
        '201':
          description: Factura creada y emitida

  /invoices/{id}/issue:
    post:
      summary: Emitir factura (asigna secuencial)
      parameters:
        - name: id
          in: path
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                establishmentId:
                  type: string
                emissionPointId:
                  type: string
              required: [establishmentId, emissionPointId]
      responses:
        '200':
          description: Factura emitida

  /invoices/{id}/void:
    post:
      summary: Anular factura
      parameters:
        - name: id
          in: path
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required: [reason]
      responses:
        '200':
          description: Factura anulada

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
