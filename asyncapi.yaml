asyncapi: 2.6.0
info:
  title: billing-service (eventos)
  version: 1.0.0
  description: Eventos publicados por billing-service

channels:
  billing.invoice.created:
    publish:
      summary: Factura en borrador creada
      message:
        payload:
          type: object
          properties:
            invoiceId:
              type: string
            organizationId:
              type: string
            status:
              type: string
            totalCents:
              type: integer

  billing.invoice.issued:
    publish:
      summary: Factura emitida con secuencial
      message:
        payload:
          type: object
          properties:
            invoiceId:
              type: string
            customerId:
              type: string
              description: Cliente de la factura; tesorería abre la partida de cartera por este id.
            number:
              type: string
            sequentialNumber:
              type: string
            issueDate:
              type: string
              format: date-time
              nullable: true
            documentTypeCode:
              type: string
              description: Código SRI del comprobante (01 factura, 04 nota de crédito…).
            relatedInvoiceId:
              type: string
              nullable: true
              description: Factura original cuando el comprobante es una nota de crédito/débito.
            relatedIssueDate:
              type: string
              format: date-time
              nullable: true
            creditNoteReason:
              type: string
              nullable: true
            posSaleId:
              type: string
              nullable: true
              description: Si viene, la venta se cobró en el POS y no genera cuenta por cobrar.
            paymentMethodCode:
              type: string
              nullable: true
            userId:
              type: string
              description: Usuario que emitió (para la campana); se omite si no vino en X-User-Id.
            organizationId:
              type: string
            countryCode:
              type: string
            establishmentId:
              type: string
            emissionPointId:
              type: string
            customerSnapshot:
              type: object
            issuerSnapshot:
              type: object
            subtotalCents:
              type: integer
            taxTotalCents:
              type: integer
            totalCents:
              type: integer
            currencyCode:
              type: string
            lines:
              type: array
              items:
                type: object
                properties:
                  productId:
                    type: string
                  description:
                    type: string
                  quantity:
                    type: number
                  unitPriceCents:
                    type: integer
                  discountCents:
                    type: integer
                  subtotalCents:
                    type: integer
                  taxes:
                    type: array
                    items:
                      type: object
                      properties:
                        taxRateId:
                          type: string
                        kind:
                          type: string
                        rateSnapshot:
                          type: string
                        baseCents:
                          type: integer
                        amountCents:
                          type: integer

  billing.invoice.voided:
    publish:
      summary: Factura anulada
      message:
        payload:
          type: object
          properties:
            invoiceId:
              type: string
            number:
              type: string
            organizationId:
              type: string
            issueDate:
              type: string
              format: date-time
              nullable: true
            reason:
              type: string
            voidedAt:
              type: string
              format: date-time
